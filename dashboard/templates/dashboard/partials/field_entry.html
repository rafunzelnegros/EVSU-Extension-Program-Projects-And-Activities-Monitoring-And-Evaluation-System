<div class="field-entry"><div class="activity-head"><b>{% if a %}{{a.title}}{% else %}Monitoring Entry{% endif %}</b><button type="button" class="icon danger-text" data-remove>Remove</button></div><div class="formgrid two"><label>Objectives<textarea name="fv_objectives[]" rows="2">{% if a %}{{a.objectives}}{% endif %}</textarea></label><label>Activities<textarea name="fv_activities[]" rows="2">{% if a %}{{a.title}}{% endif %}</textarea></label></div><div class="formgrid three"><label>Date<input type="date" name="fv_date[]" value="{% if a.date %}{{a.date|date:'Y-m-d'}}{% endif %}"></label><label>Place<input name="fv_place[]" value="{% if a %}{{a.venue}}{% endif %}"></label><label>Time<input type="time" name="fv_time[]" value="{% if a.time %}{{a.time|time:'H:i'}}{% endif %}"></label></div><div class="formgrid two"><label>Expected Output — Parameter<input name="fv_parameter[]" value="{% if a %}{{a.learning_outcomes|truncatechars:120}}{% endif %}"></label><label>Expected Output — Target<input name="fv_target[]"></label><label>Person Contacted<input name="fv_person[]" value="{% if a %}{{a.activity_leader}}{% endif %}"></label><label>Position<input name="fv_position[]"></label></div><div class="formgrid three"><label>Result<select name="fv_result[]"><option value="COMPLETED">Completed</option><option value="RESCHEDULED">Rescheduled</option><option value="NOT_CONDUCTED" selected>Not Conducted</option></select></label><label>New Date (if Rescheduled)<input type="date" name="fv_rescheduled[]"></label><label>Remarks<textarea name="fv_remarks[]" rows="2" placeholder="Observations, issues, problems, action points, comments"></textarea></label></div></div>
