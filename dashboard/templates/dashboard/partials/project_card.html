<div class="project-card" data-project><input type="hidden" name="project_index[]" value="{{idx}}"><div class="project-head"><div><span class="step">Project {{idx}}</span><h3>Project Design</h3></div><button type="button" class="icon danger-text" data-remove>Remove Project</button></div><div class="formgrid three"><label>Notice to Proceed No.<input name="project_{{idx}}_notice_to_proceed_no"></label><label>Special Order No.<input name="project_{{idx}}_special_order_no"></label><label>A. Title<input name="project_{{idx}}_title"></label></div><label>B. Proponent/s<textarea name="project_{{idx}}_proponents" rows="2"></textarea></label><div class="formgrid three"><label>Partner Category<select name="project_{{idx}}_partner_category"><option value="">None</option><option>LGU</option><option value="INDUSTRY">Industry</option><option>SME</option><option value="OTHERS">Others</option></select></label><label>Partner Name<input name="project_{{idx}}_partner_name"></label><label class="checkline"><input type="checkbox" name="project_{{idx}}_with_moa_mou"> With MOA/MOU</label></div><div class="formgrid three"><label class="checkline"><input type="checkbox" name="project_{{idx}}_board_confirmed"> Board Confirmed</label><label>Board Resolution No.<input name="project_{{idx}}_board_resolution_no"></label><label>Board Resolution Date<input type="date" name="project_{{idx}}_board_resolution_date"></label></div><div class="formgrid three"><label>Leader<input name="project_{{idx}}_leader_name"></label><label>Position/Designation<input name="project_{{idx}}_leader_position"></label><label>Email/Contact<input name="project_{{idx}}_leader_contact"></label><label>Assistant Leader<input name="project_{{idx}}_assistant_name"></label><label>Position/Designation<input name="project_{{idx}}_assistant_position"></label><label>Email/Contact<input name="project_{{idx}}_assistant_contact"></label></div><label>Members<textarea name="project_{{idx}}_members" rows="2"></textarea></label><div class="formgrid two"><label>Type of Clientele<textarea name="project_{{idx}}_clientele" rows="2"></textarea></label><label>Target Area<input name="project_{{idx}}_target_area"></label><label>Start Date<input type="date" name="project_{{idx}}_start_date"></label><label>End Date<input type="date" name="project_{{idx}}_end_date"></label><label>Project Cost<input type="number" min="0" step="0.01" name="project_{{idx}}_project_cost"></label><label>Funding Source<input name="project_{{idx}}_funding_source"></label></div><label>URDEA<textarea name="project_{{idx}}_urdea" rows="2"></textarea></label><label>SDG/s<textarea name="project_{{idx}}_sdgs" rows="2"></textarea></label><div class="nested-activities" data-prefix="project_{{idx}}_"><h4>J. Activities</h4>{% for x in '123' %}<div class="activity-card compact"><b>Activity {{forloop.counter}}</b><div class="formgrid three"><label>Title<input name="project_{{idx}}_activity_title[]"></label><label>Date<input type="date" name="project_{{idx}}_activity_date[]"></label><label>Time<input type="time" name="project_{{idx}}_activity_time[]"></label><label>Venue<input name="project_{{idx}}_activity_venue[]"></label><label>Activity Leader<input name="project_{{idx}}_activity_leader[]"></label><label>Budget<input type="number" min="0" step="0.01" name="project_{{idx}}_activity_budget[]"></label></div><div class="formgrid three"><label>Topics<textarea name="project_{{idx}}_activity_topics[]" rows="2"></textarea></label><label>Objectives<textarea name="project_{{idx}}_activity_objectives[]" rows="2"></textarea></label><label>Learning Outcomes<textarea name="project_{{idx}}_activity_outcomes[]" rows="2"></textarea></label></div></div>{% endfor %}<button type="button" class="secondary" data-add-nested-activity>＋ Add Activity</button></div></div>
