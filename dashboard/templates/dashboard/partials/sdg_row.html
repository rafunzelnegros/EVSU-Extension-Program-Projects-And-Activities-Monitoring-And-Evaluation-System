<div class="sdg-row" data-sdg-row>
  <div class="sdg-row-head"><b>SDG <span data-sdg-number>{{n}}</span></b><button type="button" class="icon danger-text" data-remove-sdg>Remove</button></div>
  <div class="formgrid two">
    <label>Goal Description<input name="{{prefix}}sdg_goal[]" placeholder="Input SDG goal description"></label>
    <label>Target<input name="{{prefix}}sdg_target[]" placeholder="Input target"></label>
  </div>
  <div class="formgrid two">
    <label>Description<textarea name="{{prefix}}sdg_description[]" rows="2" placeholder="Input description"></textarea></label>
    <label>Indicator<input name="{{prefix}}sdg_indicator[]" placeholder="Input indicator"></label>
  </div>
</div>
