<div class="activity-card">
  <div class="activity-head"><b>Activity {{n}}</b><button type="button" class="icon danger-text" data-remove>Remove</button></div>
  <div class="formgrid three"><label>Activity Title<input name="activity_title[]" placeholder="Input activity title"></label><label>Date<input type="date" name="activity_date[]"></label><label>Time<input type="time" name="activity_time[]"></label><label>Venue<input name="activity_venue[]" placeholder="Input venue"></label><label>Activity Leader<input name="activity_leader[]" placeholder="Input activity leader"></label><label>Budget<input type="number" min="0" step="0.01" name="activity_budget[]" placeholder="0.00"></label></div>
  <div class="formgrid three"><label>Topics<textarea name="activity_topics[]" rows="2" placeholder="Input topics"></textarea></label><label>Objectives<textarea name="activity_objectives[]" rows="2" placeholder="Input objectives"></textarea></label><label>Learning Outcomes<textarea name="activity_outcomes[]" rows="2" placeholder="Input learning outcomes"></textarea></label></div>
</div>
